name: Release

# Publishes a numbered, immutable GitHub Release for a pushed vX.Y.Z tag.
# Never runs on pushes to main — a release is only ever cut from an explicit
# tag, never a mutable branch head. See RELEASING.md for the full runbook,
# including the separate, manual promotion step in TestManagementProject.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse to republish an already-published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # action-gh-release creates the release as a draft before uploading
          # assets, then publishes it — so an interrupted run (e.g. an asset
          # upload failure) leaves an unpublished draft behind. That draft
          # was never promoted anywhere (no checksum was ever advertised for
          # it), so resuming it on rerun is safe; only a *published* release
          # for this tag must block a rerun, since only that could already
          # have a promoted, pinned-checksum URL.
          if release_json=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft 2>/dev/null); then
            is_draft=$(echo "$release_json" | jq -r '.isDraft')
            if [ "$is_draft" != "true" ]; then
              echo "error: release $GITHUB_REF_NAME already exists and is published — a release is never republished." >&2
              echo "       action-gh-release overwrites same-named assets by default; moving this tag" >&2
              echo "       and rerunning would replace bytes at an already-promoted, pinned-checksum URL." >&2
              echo "       Cut a new version instead." >&2
              exit 1
            fi
            echo "note: resuming existing unpublished draft release for $GITHUB_REF_NAME"
          fi

      - name: Verify the tag matches the VERSION file
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(cat VERSION)"
          if [ "$tag_version" != "$file_version" ]; then
            echo "error: tag $GITHUB_REF_NAME does not match VERSION file ($file_version)" >&2
            exit 1
          fi

      - name: Run packaging test suite
        run: |
          for test in tests/*_test.sh; do
            bash "$test"
          done

      - name: Package release artifact
        run: ./scripts/package-release.sh "$GITHUB_REF_NAME"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.manifest.json
          generate_release_notes: true
